name: GitHub Classroom Workflow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, build and v2 API checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: reservation-service/go.mod
          cache-dependency-path: |
            reservation-service/go.sum
            payment-service/go.sum
            loyalty-service/go.sum

      - name: Test and build all services
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          for service in reservation-service payment-service loyalty-service gateway-service; do
            echo "::group::$service"
            (
              cd "$service"
              go test -race -count=1 ./...
              go vet ./...
              CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/$service" .
            )
            echo "::endgroup::"
          done

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Prepare shell scripts for Linux
        run: |
          sed -i 's/\r$//' scripts/*.sh postgres/*.sh
          chmod +x scripts/*.sh

      - name: Run containers and wait for services
        timeout-minutes: 5
        run: |
          docker compose up -d
          bash ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Newman
        run: npm install --global newman@6

      - name: Run instructor API tests
        id: autograder
        timeout-minutes: 5
        run: >-
          newman run v2/postman/collection.json
          --environment v2/postman/environment.json
          --delay-request 100
          --reporters cli

      # Preserve the instructor's optional Google Sheets integration.
      - name: Github auto grader mark
        if: ${{ success() && env.GOOGLE_API_KEY != '' }}
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{ secrets.GOOGLE_API_KEY }}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Stop CI containers
        if: always()
        continue-on-error: true
        run: docker compose down --volumes
